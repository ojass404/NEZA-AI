services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: neza-postgis
    environment:
      POSTGRES_DB: neza
      POSTGRES_USER: neza
      POSTGRES_PASSWORD: neza
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neza -d neza"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgis_data:
